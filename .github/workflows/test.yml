name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.source }}-${{ matrix.expr }}-${{ matrix.link }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [nginx, nginx-ext]
        expr: [enabled, disabled]
        link: [static, dynamic]
    steps:
      - name: Check out module
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out nginx
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.source == 'nginx' && 'nginx/nginx' || 'HanadaLee/nginx-ext' }}
          ref: ${{ matrix.source == 'nginx' && 'release-1.31.8' || '1.31.8' }}
          path: .ci/nginx
          persist-credentials: false

      - name: Check out ngx_expr_module
        if: matrix.expr == 'enabled'
        uses: actions/checkout@v6
        with:
          repository: HanadaLee/ngx_expr_module
          ref: '1.0.1'
          path: .ci/ngx_expr_module
          persist-credentials: false

      - name: Check out nginx-tests
        uses: actions/checkout@v6
        with:
          repository: nginx/nginx-tests
          ref: ec44bc80c4bfac1dbd8ffee3875101285f8502ac
          path: .ci/nginx-tests
          persist-credentials: false

      - name: Check out test-nginx
        uses: actions/checkout@v6
        with:
          repository: openresty/test-nginx
          ref: 8398ecbf08c419be4acf85d078b372c3b1be988a
          path: .ci/test-nginx
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libpcre2-dev libssl-dev zlib1g-dev perl \
            libtest-base-perl libtext-diff-perl libtest-longstring-perl \
            libwww-perl libipc-run-perl libio-socket-ssl-perl \
            liblist-moreutils-perl libnet-dns-perl

      - name: Build and test
        env:
          TEST_EXPR: ${{ matrix.expr }}
          TEST_MODULE_LINK: ${{ matrix.link }}
        run: bash util/run-tests.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.source }}-${{ matrix.expr }}-${{ matrix.link }}
          path: |
            .ci/test-output/**/*.log
            .ci/test-output/*.txt
            .ci/test-output/results.tsv
            .ci/test-output/exit-code
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
